name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: vet
        run: go vet ./...

      - name: build .app bundle
        run: make app

      - name: zip bundle
        run: |
          cd build
          zip -r MoleBar.app.zip MoleBar.app

      - uses: actions/upload-artifact@v4
        with:
          name: MoleBar.app
          path: build/MoleBar.app.zip

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MoleBar.app.zip
