name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.21"

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Build .app (try universal)
        run: |
          if make app UNIVERSAL=1 VERSION="$VERSION"; then
            echo "Built universal .app"
          else
            echo "Universal build failed; falling back to native architecture"
            make app VERSION="$VERSION"
          fi
          echo "Binary:"
          file build/MoleBar.app/Contents/MacOS/molebar
          lipo -info build/MoleBar.app/Contents/MacOS/molebar || true
          echo "Info.plist versions:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/MoleBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/MoleBar.app/Contents/Info.plist

      - name: Optional Developer ID signing
        if: ${{ secrets.CODESIGN_IDENTITY != '' }}
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: make sign VERSION="$VERSION" CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Package with ditto
        run: |
          mkdir -p dist
          ditto -c -k --keepParent --norsrc --noextattr --noqtn build/MoleBar.app "dist/MoleBar-${VERSION}.app.zip"
          git archive --format=tar.gz --prefix="molebar-${VERSION}/" -o "dist/molebar-${VERSION}.tar.gz" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoleBar
          path: |
            dist/MoleBar-${{ env.VERSION }}.app.zip
            dist/molebar-${{ env.VERSION }}.tar.gz

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/MoleBar-${{ env.VERSION }}.app.zip
            dist/molebar-${{ env.VERSION }}.tar.gz
          generate_release_notes: true
